# quarrel: one Cargo workspace (ADR-0002).
#
#   crates/quarrel-shipper   tails log files and forwards them without losing a line
#   crates/quarrel-core      (planned) the shared event model, buffer, outputs and state
#   crates/quarrel-probe     (planned) the network probe
#
# Commands run from this directory: `cargo test` tests every crate;
# `cargo run -p quarrel-shipper -- <args>` runs the shipper.

[workspace]
members = ["crates/quarrel-shipper"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sunergeo/quarrel"
publish = false

# Profiles only take effect here, at the workspace root; Cargo ignores them in member crates.
[profile.release]
# The day-2 lesson: release builds wrap integer overflow silently by default.
# The shipper does arithmetic on byte offsets; a silent wrap there is silent data loss.
overflow-checks = true
# Drop debug symbols from the shipped binaries (smaller images).
strip = true
