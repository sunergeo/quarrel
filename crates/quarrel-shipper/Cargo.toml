[package]
name = "quarrel-shipper"
description = "Per-host log shipper: tails log files and ships them to an ingest endpoint"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Layout (the Cargo conventions, nothing custom), relative to this crate:
#   src/lib.rs      the library: all real logic lives here, so tests can reach it
#   src/main.rs     the binary: a thin shell that calls into the library
#   tests/*.rs      integration tests (each file is its own test crate)

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
# Each roadmap stop adds the crates it needs, when it needs them.

[dev-dependencies]
tempfile = "3.27.0"
